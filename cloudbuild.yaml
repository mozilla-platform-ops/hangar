steps:
  # Build frontend
  - name: "node:20-slim"
    id: build-frontend
    entrypoint: bash
    args:
      - "-c"
      - "cd frontend && npm ci --prefer-offline && npm run build"

  # Build and push Docker image (multi-stage, uses repo root as context)
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    waitFor: ["build-frontend"]
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend:$COMMIT_SHA
      - --tag=$_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend:latest
      - --cache-from=$_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend:latest
      - .

  - name: "gcr.io/cloud-builders/docker"
    id: push-image
    waitFor: ["build-image"]
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy
    waitFor: ["push-image"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hangar
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend:$COMMIT_SHA
      - --region=$_REGION
      - --quiet

substitutions:
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  # Do NOT set machineType: E2_HIGHCPU_8 here. Combined with the user-specified
  # build service account this trigger runs as (hangar-run@), 8-CPU workers
  # never get scheduled -- builds sat QUEUED for 48-64 min on 2026-08-03, which
  # straddles the default 3600s queueTtl, so deploys either landed ~50 min late
  # or silently EXPIRED with no error. Isolated by probe builds: either factor
  # alone schedules in 15-75s, only the combination starves. The default machine
  # type schedules in ~15s and builds this repo in a few minutes, which is
  # plenty -- the vite build itself is under a second.

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/hangar/backend:latest
