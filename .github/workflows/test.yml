name: test

# Hangar auto-deploys to production on merge to main (cloudbuild.yaml), so this
# is the only gate between a PR and prod. Modeled on relops-bootstrap's
# .github/workflows/test.yml to keep the two repos' CI shaped the same way.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Match the node major the production build uses (backend/Dockerfile,
      # cloudbuild.yaml) so CI can't pass on a version prod doesn't use.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        run: npm ci --prefer-offline
      # `npm run build` is `tsc -b && vite build`, so this is typecheck + bundle.
      # This is what catches a breaking dependency bump -- e.g. a tailwind or
      # react-router major landing via Dependabot fails here instead of shipping.
      - name: build
        run: npm run build

  image:
    name: image (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the real multi-stage artifact Cloud Build deploys: node builds the
      # SPA, then python installs backend/requirements.txt. Catches broken
      # backend dependency bumps, which nothing else here would -- there are no
      # backend tests yet. requirements.txt is fully pinned and installed with
      # --require-hashes, so this also fails on a hand-edited or hash-mismatched
      # entry (see the Dependabot note in CLAUDE.md). Does not push; this only
      # proves the image assembles.
      - name: docker build
        run: docker build --file=backend/Dockerfile --tag=hangar-ci:${{ github.sha }} .

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      # Pinned to the version RelOps runs locally, for the same reason the
      # frontend job pins node: `terraform fmt -check` encodes one version's
      # canonical formatting, so floating on latest would fail unrelated PRs
      # the day a new release changes it.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      # -backend=false is what makes this job possible without GCP credentials:
      # it installs the providers (so `validate` can check resource schemas)
      # without touching the local state or needing ADC. That matters because
      # this repo's terraform is applied by hand from laptops, so CI could not
      # authenticate even if we wanted it to.
      - name: init
        run: terraform init -backend=false -input=false
      # The gap this closes: before this job, nothing in CI read terraform/ at
      # all, so Dependabot's provider bumps (#107/#108 -- two google provider
      # MAJORS) sat green and looked mergeable. `validate` catches exactly that
      # class of break, e.g. iap.enabled becoming required in provider 6.0.
      - name: validate
        run: terraform validate

  lint:
    name: lint (non-blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        run: npm ci --prefer-offline
      # Non-blocking on purpose: main currently has 17 eslint errors + 4 warnings
      # that predate this workflow -- 9 are react-hooks/set-state-in-effect, the
      # rest react-refresh/only-export-components, react-hooks/{purity,refs,
      # exhaustive-deps,incompatible-library} and @typescript-eslint/no-explicit-any.
      # Reporting them without blocking keeps the debt visible instead of hidden.
      # Once those are cleared, drop continue-on-error and add this job to the
      # ruleset's required checks.
      - name: eslint
        continue-on-error: true
        run: npm run lint
